[project]
name = "tessera"
version = "0.1.0"
description = "Citation-grounded medication safety for family caregivers"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "numpy>=1.26",
    "lxml>=5.2",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
tessera = "tessera.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The cache provider cannot create .pytest_cache in this environment and emits a
# warning on every run. Disabled so test output stays pristine.
addopts = "-p no:cacheprovider"
# Repo root on sys.path so tests can import the one-off builders in scripts/.
# The editable install only exposes src/tessera.
pythonpath = ["."]
